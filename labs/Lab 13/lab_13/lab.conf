LAB_DESCRIPTION="A simple Kathara network to demonstrate IPv4 routing"
LAB_VERSION="1.0"
LAB_AUTHOR="C Ingrams"
LAB_EMAIL="cfi@dmu.ac.uk"
LAB_WEB=""

# create the subnets
gww[0]="W"
m1[0]="W"
m2[0]="W"

gwx[0]="X"
m6[0]="X"
m7[0]="X"

gwy[0]="Y"
m12[0]="Y"
m13[0]="Y"

gwz[0]="Z"
m16[0]="Z"
m17[0]="Z"

# link the subnets via the twin NIC carded gateway machines
gww[1]="D"
gwx[1]="D"
gwy[1]="Z"
gwz[1]="D"
gw[0]="D"

# provide dns - not essential for this lab but useful none-the-less
dns1[0]="D"

