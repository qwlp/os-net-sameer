# demonstration of bridging / switching
# a0 is an access layer switch (hosts with IP addresses are connected to it).

# 8 port access layer switch a10 - we give it 8 ethernet cards
a10[0]=a10-d1
a10[1]=a101
a10[2]=a102
a10[3]=a103
a10[4]=a104
a10[5]=a105
a10[6]=a106
a10[7]=a10-d0

# we will only connect three hosts to the a10 switch
h101[0]=a101
h102[0]=a102
h103[0]=a103

# we will have a further two distribution layer switches, each with 5 ports
# d0
d0[0]=d0-c0
d0[1]=d0-c1

d0[2]=d0-d1
d0[3]=a0-d0
d0[4]=a10-d0

# d1
d1[0]=d1-c0
d1[1]=d1-c1

d1[2]=d0-d1
d1[3]=a0-d1
d1[4]=a10-d1



